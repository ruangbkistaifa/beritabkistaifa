<a class="skip" href="#isi">Langsung ke isi</a>
<header class="site-head">
  <div class="wrap bar">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/logo.jpg' | relative_url }}" alt="Logo STAIFA Pamekasan" width="42" height="42">
      <span><b>Berita Prodi BKI</b><small>{{ site.kampus }}</small></span>
    </a>
    <nav class="nav" aria-label="Navigasi utama">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' or page.url contains '/halaman/' %} aria-current="page"{% endif %}>Beranda</a>
      {% for r in site.data.rubrik %}
      <a href="{{ r.url | relative_url }}"{% if page.rubrik == r.id %} aria-current="page"{% endif %}>{{ r.singkat }}</a>
      {% endfor %}
      <a href="{{ '/arsip/' | relative_url }}"{% if page.url == '/arsip/' %} aria-current="page"{% endif %}>Arsip</a>
      <a class="nav-search" href="{{ '/cari/' | relative_url }}" aria-label="Cari berita"{% if page.url == '/cari/' %} aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Cari</span>
      </a>
    </nav>
  </div>
</header>
